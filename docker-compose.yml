services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: razorguard
      POSTGRES_PASSWORD: razorguard
      POSTGRES_DB: razorguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-razorguard_neo4j}
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 100m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  kafka:
    # bitnami/kafka versioned tags were moved off Docker Hub (2025). Same KRaft env.
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    volumes:
      - kafka_data:/bitnami/kafka

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://razorguard:razorguard@postgres:5432/razorguard
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-networkx}
      GRAPH_NEO4J_FALLBACK: ${GRAPH_NEO4J_FALLBACK:-true}
      GRAPH_REBUILD_ON_START: ${GRAPH_REBUILD_ON_START:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-razorguard_neo4j}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      EVENT_BUS: ${EVENT_BUS:-inprocess}
      EVENT_BUS_FALLBACK: ${EVENT_BUS_FALLBACK:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_BACKGROUND_WORKER: ${OUTBOX_BACKGROUND_WORKER:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    volumes:
      - ./ml/models:/app/ml/models

  event-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.workers.event_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://razorguard:razorguard@postgres:5432/razorguard
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: ${EVENT_BUS:-inprocess}
      EVENT_BUS_FALLBACK: ${EVENT_BUS_FALLBACK:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      OUTBOX_ENABLED: "true"
      GRAPH_BACKEND: ${GRAPH_BACKEND:-networkx}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    volumes:
      - ./ml/models:/app/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

volumes:
  postgres_data:
  neo4j_data:
  kafka_data:
